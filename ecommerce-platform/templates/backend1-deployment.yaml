{{- if .Values.backend1.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.backend1.name }}
  labels:
    app: {{ .Values.backend1.name }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: {{ .Values.backend1.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.backend1.name }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Values.backend1.name }}
          image: "{{ .Values.backend1.image.repository }}:{{ .Values.backend1.image.tag }}"
          imagePullPolicy: {{ .Values.backend1.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend1.port }}
          env:
            {{- range $key, $value := .Values.backend1.env }}
            - name: {{ $key }}
              value: "{{ $value }}"
            {{- end }}
          resources:
            {{- toYaml .Values.backend1.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
{{- end }}

