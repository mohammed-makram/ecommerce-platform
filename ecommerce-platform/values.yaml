# Default values for ecommerce-platform

# Global configuration
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# Service configuration
service:
  type: LoadBalancer
  ports:
    frontend: 3000
    backend1: 3001
    backend2: 3002

# Backend 1 - User Management API
backend1:
  enabled: true
  image:
    repository: mohamedmakram/user-management-api
    tag: "v1.0.7"
    pullPolicy: IfNotPresent
  name: user-management-api
  port: 3001
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  env:
    NODE_ENV: "production"
    PORT: "3001"
    API_TIMEOUT: "30"
    LOG_LEVEL: "info"

# Backend 2 - Payment Processing API
backend2:
  enabled: true
  image:
    repository: mohamedmakram/backend-py
    tag: "v1.0.5"
    pullPolicy: IfNotPresent
  name: payment-processing-api
  port: 3002
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  env:
    FLASK_ENV: "production"
    PORT: "3002"
    API_TIMEOUT: "30"
    LOG_LEVEL: "info"

# Frontend - Shopping Cart
frontend:
  enabled: true
  image:
    repository: mohamedmakram/frontend
    tag: "v1.0.0"
    pullPolicy: IfNotPresent
  name: shopping-cart-frontend
  port: 3000
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  env:
    REACT_APP_API_BASE_URL: "http://user-management-api-service:3001"
    REACT_APP_PAYMENT_API_BASE_URL: "http://payment-processing-api-service:3002"

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: "/"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: ecommerce.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Resource limits
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Pod security context
podSecurityContext:
  fsGroup: 2000

# Container security context
securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# Network policies
networkPolicy:
  enabled: true

# Monitoring
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s

